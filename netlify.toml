# Netlify Configuration & Redirects

[[redirects]]
  from = "https://consorcioone.netlify.app/*"
  to = "https://c7contempla.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://consorcioone.netlify.app/*"
  to = "https://c7contempla.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/index"
  to = "/index.html"
  status = 200

# Security & Compliance HTTP Headers (OWASP / LGPD / Anti-Clickjacking)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self' https: http:; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.sheetjs.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https: http: ws: wss: https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://viacep.com.br https://cdn.jsdelivr.net; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"

